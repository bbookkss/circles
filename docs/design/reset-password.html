<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New password – Circles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300;400;500;600&display=swap">
<script>try { const t = localStorage.getItem("circles-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="circles.css">
<style>

.band { height: 260px; margin-top: -66px; }
.band::after { content: ""; position: absolute; inset: auto 0 0 0; height: 120px; background: linear-gradient(to bottom, transparent, var(--paper)); }
.auth { position: relative; z-index: 1; margin-top: -150px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px; }
.auth .sheet { padding: 32px; }
.auth .h-md + p { margin-top: 8px; }
.auth .form { margin-top: 26px; }
.auth .foot { margin-top: 22px; text-align: center; font-size: 15px; color: var(--quiet); }
.label-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.label-row a { font-size: 13px; color: var(--quiet); }
.notice { border-radius: 14px; padding: 12px 14px; font-size: 14px; background: var(--cool); }
.notice.err-box { color: var(--danger); }
.notice a { color: var(--ink); }
@media (max-width: 640px) { .auth .sheet { padding: 24px 20px; } .band { height: 220px; } .auth { margin-top: -120px; } }

</style>
</head>
<body>
<header class="nav" data-page="out"></header>
<section class="band map" aria-hidden="true"><canvas id="map"></canvas></section>
<main class="auth"><div class="narrow">
<div class="sheet glass">

<h1 class="h-md">Choose a new password</h1>
<p class="quiet">You'll be logged in once it's saved.</p>
<form class="form" id="f">
  <div class="field">
    <label for="password">New password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required>
    <span class="hint">At least 8 characters.</span>
  </div>
  <div class="field">
    <label for="confirm">Type it again</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
  </div>
  <p class="err" id="err" hidden>The two passwords don't match.</p>
  <button class="btn block" id="go" type="submit">Save password</button>
</form>
<p class="foot"><a class="link" href="login.html">Back to log in</a></p>

</div>
</div></main>
<script src="circles.js"></script>
<script>

Circles.drawMap(document.getElementById("map"), [
  { x: .18, y: .40, r: 80, temp: .55 }, { x: .52, y: .30, r: 64, temp: .35 }, { x: .84, y: .46, r: 72, temp: .45 }
], { seed: 41 });

document.querySelectorAll("form").forEach(f => f.addEventListener("submit", e => e.preventDefault()));

document.getElementById("f").addEventListener("submit", () => {
  const p = document.getElementById("password").value, c = document.getElementById("confirm").value;
  const err = document.getElementById("err");
  err.hidden = p === c && p.length > 0;
  if (!err.hidden) { err.textContent = p.length < 8 ? "Use at least 8 characters." : "The two passwords don't match."; return; }
  const b = document.getElementById("go"); b.disabled = true; b.textContent = "Saving…";
  setTimeout(() => location.href = "home.html", 600);
});

</script>
</body>
</html>
